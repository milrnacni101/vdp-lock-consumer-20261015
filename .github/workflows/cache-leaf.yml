name: VDP cache leaf
on:
  workflow_call:
cache-mode: write
permissions: {}
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Record effective cache mode
        run: |
          echo "effective_cache_mode=$ACTIONS_CACHE_MODE"
          printf 'owned nested cache marker\n' > cache-marker.txt
      - name: Attempt cache save
        uses: actions/cache/save@v4
        with:
          path: cache-marker.txt
          key: vdp-nested-none-${{ github.run_id }}-${{ github.run_attempt }}
