name: VDP policy listener
on:
  repository_dispatch:
    types: [vdp-policy-chain]
permissions: {}
jobs:
  listener:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "POLICY_PROTECTED_LISTENER_EXECUTED"
          echo "actor=${{ github.actor }}"
          echo "marker=${{ github.event.client_payload.marker }}"
