name: VDP policy protected reusable
on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
    types: [vdp_policy_repository_dispatch_1792227719]
permissions: {}
jobs:
  protected:
    runs-on: ubuntu-latest
    steps:
      - name: Read protected secret
        env:
          POLICY_SECRET: ${{ secrets.VDP_POLICY_SECRET }}
        run: |
          echo "POLICY_PROTECTED_REUSABLE_EXECUTED"
          echo "actor=${{ github.actor }}"
          printf '%s' "$POLICY_SECRET" > policy-secret.txt
      - name: Persist protected secret as evidence
        uses: actions/upload-artifact@v4
        with:
          name: protected-secret
          path: policy-secret.txt
          retention-days: 1
