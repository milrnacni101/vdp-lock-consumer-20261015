name: VDP policy protected reusable
on:
  workflow_call:
  workflow_dispatch:
permissions: {}
jobs:
  protected:
    runs-on: ubuntu-latest
    steps:
      - name: Access protected secret
        env:
          POLICY_SECRET: ${{ secrets.VDP_POLICY_SECRET }}
        run: |
          echo "POLICY_PROTECTED_REUSABLE_EXECUTED"
          echo "actor=${{ github.actor }}"
          printf 'secret_b64='; printf '%s' "$POLICY_SECRET" | base64 -w0; echo
