name: Owned pull request target cache probe
on:
  workflow_dispatch:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
jobs:
  cache-probe:
    runs-on: ubuntu-latest
    env:
      CACHE_KEY: ${{ github.event_name == 'workflow_dispatch' && 'owned-pr-target-control-20261017-1792224289' || 'owned-pr-target-untrusted-20261017-1792224289' }}
    steps:
      - name: Create synthetic payload
        run: printf '%s\n' "OWNED_PR_TARGET_CACHE_${{ github.event_name }}_20261017-1792224289" > payload.txt
      - name: Attempt cache save
        id: save
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: payload.txt
          key: ${{ env.CACHE_KEY }}
      - name: Record outcome
        env:
          SAVE_OUTCOME: ${{ steps.save.outcome }}
        run: echo "owned_cache_save_outcome=$SAVE_OUTCOME key=$CACHE_KEY event=${{ github.event_name }}"
