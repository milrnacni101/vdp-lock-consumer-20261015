name: VDP vulnerability alerts callee job grant
on:
  workflow_call:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    permissions:
      vulnerability-alerts: read
    runs-on: ubuntu-latest
    steps:
      - name: Query owned repository alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl --silent --show-error \
            --output response.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${{ github.repository }}/dependabot/alerts?per_page=10")
          printf '%s\n' "$code" > status.txt
          jq 'if type == "array" then length else 0 end' response.json > count.txt
          echo "dependabot_alerts_http_status=$code"
          echo "dependabot_alert_count=$(cat count.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: vulnerability-alert-job-response
          path: |
            status.txt
            count.txt
            response.json
          retention-days: 1
