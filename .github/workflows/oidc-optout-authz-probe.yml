name: OIDC optout authz probe
on: workflow_dispatch
permissions:
  id-token: write
  contents: none
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print subject only
        shell: bash
        run: |
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-vdp-owned-oidc-optout-probe")"
          OIDC_RESPONSE="$response" python3 - <<'PY'
          import base64, json, os
          token = json.loads(os.environ["OIDC_RESPONSE"])["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print("OIDC_SUBJECT_PROOF=" + json.dumps({"sub": claims["sub"], "repository_id": claims["repository_id"], "repository_owner_id": claims["repository_owner_id"]}, sort_keys=True))
          PY
