name: OIDC immutable subject probe
on: workflow_dispatch
permissions:
  id-token: write
  contents: none
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print selected non-secret claims
        shell: bash
        run: |
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-vdp-owned-oidc-probe")"
          OIDC_RESPONSE="$response" python3 - <<'PY'
          import base64, json, os
          token = json.loads(os.environ["OIDC_RESPONSE"])["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          selected = {key: claims.get(key) for key in (
              "sub", "aud", "repository", "repository_id", "repository_owner", "repository_owner_id",
              "ref", "workflow_ref", "workflow_sha", "job_workflow_ref", "job_workflow_sha",
          )}
          print("OIDC_SELECTED_CLAIMS=" + json.dumps(selected, sort_keys=True))
          PY
