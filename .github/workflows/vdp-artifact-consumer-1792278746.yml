name: VDP privileged artifact consumer 1792278746
on:
  workflow_run:
    workflows: ["VDP untrusted artifact source 1792278746"]
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  consume:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Allow post-success producer mutation window
        run: sleep 30
      - name: Download the validated producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vdp-validated-payload-1792278746
          path: .vdp-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute the downloaded payload in the privileged job
        env:
          VDP_POLICY_SECRET: ${{ secrets.VDP_POLICY_SECRET }}
        run: bash .vdp-payload/payload.sh
